# 五防规则库（主站防误闭锁）
#
# 表达式：设备编号=合 / 设备编号=分，& 与，| 或，! 非，支持括号
# open / close 分别为分闸、合闸操作的前置条件，both 为分合共用
#
# 以下由程序通用校验，不在此配置：
#   - 拓扑防误：合闸后出现"带电又接地"的节点（带地线合闸），带电节点挂接地线
#   - 挂牌闭锁：检修牌禁止一切遥控，禁止合闸牌禁止合闸
#   - 设备位置不定（中间态/不定态/品质无效）禁止操作
# 子站间隔层另有电气联锁（rtu-sim），主站与间隔层两道防线互为备用。

rules:
  # ---------------------------------------------------------------- 防止带负荷拉合隔离刀闸
  "1016": { both: "101=分", desc: 进线一线路侧刀闸操作前，断路器 101 须在分位 }
  "1011": { both: "101=分", desc: 进线一母线侧刀闸操作前，断路器 101 须在分位 }
  "1026": { both: "102=分", desc: 进线二线路侧刀闸操作前，断路器 102 须在分位 }
  "1021": { both: "102=分", desc: 进线二母线侧刀闸操作前，断路器 102 须在分位 }
  "1001": { both: "100=分", desc: 内桥刀闸操作前，桥断路器 100 须在分位 }
  "1002": { both: "100=分", desc: 内桥刀闸操作前，桥断路器 100 须在分位 }

  # 内桥接线主变高压侧不设断路器：拉合主变高压刀闸前，须先断开低压侧，再断开进线与桥断路器使主变停电
  "1101": { both: "901=分 & 101=分 & 100=分", desc: 1号主变高压刀闸操作前，901、101、100 须全部在分位 }
  "1102": { both: "902=分 & 102=分 & 100=分", desc: 2号主变高压刀闸操作前，902、102、100 须全部在分位 }

  # ---------------------------------------------------------------- 运行方式约束
  # 10kV 两段母线分列运行：两台主变低压侧并列会使短路电流超过开关遮断能力
  "900": { close: "!(901=合 & 902=合)", desc: 两台主变低压侧均运行时禁止合分段开关（防止主变并列） }
  "901": { close: "!(900=合 & 902=合)", desc: 分段开关合位且 2号主变运行时禁止合 901（防止主变并列） }
  "902": { close: "!(900=合 & 901=合)", desc: 分段开关合位且 1号主变运行时禁止合 902（防止主变并列） }
